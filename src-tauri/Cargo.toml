[package]
name = "openmeetnote"
version = "0.1.0"
description = "本機優先的會議記錄與成果生成工具"
authors = ["OpenMeetNote"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "openmeetnote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.1", features = ["bundled"] }
thiserror = "2.0.19"
sha2 = "0.11.0"
whisper-rs = "0.16.0"
sherpa-rs = "0.6.8"
hound = "3.5.1"
strsim = "0.11.1"
zhconv = "0.4.1"
tempdir = "0.3.7"

# 密鑰只放 OS 憑證庫（§5.6、§14）。目標平台是 Windows 與 macOS，
# 兩者的原生後端不需要額外服務。Linux 只是開發環境，不掛 secret-service：
# WSL 沒有 D-Bus session，硬連只會在每次啟動時失敗一次。
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "4", features = ["windows-native-keyring-store"] }
# 系統音訊 loopback 與麥克風擷取（§5.2）。純 Rust 綁定，不需要 C++ 工具鏈，
# 因此交叉編譯到 Windows 不會像 whisper.cpp 那樣需要額外處理。
wasapi = "0.23"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "4", features = ["apple-native-keyring-store"] }
# 系統音訊走 ScreenCaptureKit（macOS 13+），它可以直接指定 16 kHz 單聲道，
# 錄下來就是轉錄要的格式。
screencapturekit = "8"
# 麥克風走 CoreAudio。不跟系統音訊共用 ScreenCaptureKit 是因為它的麥克風
# 擷取要 macOS 15，綁在那上面等於讓 13 與 14 的使用者錄不到自己的聲音。
cpal = "0.18"
# CoreAudio 給的是裝置原生取樣率（內建麥克風多半 48 kHz）。直接每三個取一個
# 會把 8 kHz 以上摺回可聽範圍，齒音與子音正好在那裡。
rubato = "4"


# whisper-rs-sys 在交叉編譯時不會開啟 x86 SIMD：GGML_NATIVE 偵測的是編譯主機
# 而不是目標，結果 Windows 版慢九倍（RTF 3.96 對原生的 0.45）。這份 patch 只
# 多加四個 cmake define，其餘與上游相同。
[patch.crates-io]
whisper-rs-sys = { path = "vendor/whisper-rs-sys" }

# sherpa-rs 的 Diarize::compute 有兩個會讓行程崩潰的問題：C 端回傳 null 時
# 直接解參考，以及「分不出語者」那條路徑提早 bail 而跳過資源釋放，累積幾次
# 之後堆就壞了。這份 patch 只補這兩處，其餘與上游相同。
sherpa-rs = { path = "vendor/sherpa-rs" }
