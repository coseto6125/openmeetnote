[package]
name = "openmeetnote"
version = "0.1.0"
description = "本機優先的會議記錄與成果生成工具"
authors = ["OpenMeetNote"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "openmeetnote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.1", features = ["bundled"] }
thiserror = "2.0.19"
sha2 = "0.11.0"

# 密鑰只放 OS 憑證庫（§5.6、§14）。目標平台是 Windows 與 macOS，
# 兩者的原生後端不需要額外服務。Linux 只是開發環境，不掛 secret-service：
# WSL 沒有 D-Bus session，硬連只會在每次啟動時失敗一次。
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "4", features = ["windows-native-keyring-store"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "4", features = ["apple-native-keyring-store"] }
