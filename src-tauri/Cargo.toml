[package]
name = "openmeetnote"
version = "0.2.1"
description = "本機優先的會議記錄與成果生成工具"
authors = ["OpenMeetNote"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "openmeetnote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.1", features = ["bundled"] }
thiserror = "2.0.19"
sha2 = "0.11.0"
whisper-rs = "0.16.0"
hound = "3.5.1"
strsim = "0.11.1"
zhconv = "0.4.1"
tempfile = "3.27.0"
# 使用者資料目錄。日誌一定要寫得進去，而安裝版的程式目錄是唯讀的；
# 「該寫哪裡」是每個平台各自的慣例，不是一條可以自己拼出來的路徑。
dirs = "6"

# sherpa-rs 兩個平台的連結方式不同，所以不放在 [dependencies]：同一個 package
# 在兩處宣告時 feature 會被聯集，static 與 tts 併在一起會撞上上游的
# 「預編的 static 包不含 TTS」。
#
# Windows 沿用預設的動態連結：DLL 就放在 exe 旁邊，那是 Windows 的搜尋路徑，
# 而且這個組合已經實機驗證過，發布前不動它。
[target.'cfg(not(target_os = "macos"))'.dependencies]
sherpa-rs = "0.6.8"

# 密鑰只放 OS 憑證庫（§5.6、§14）。目標平台是 Windows 與 macOS，
# 兩者的原生後端不需要額外服務。Linux 只是開發環境，不掛 secret-service：
# WSL 沒有 D-Bus session，硬連只會在每次啟動時失敗一次。
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "4", features = ["windows-native-keyring-store"] }
# 系統音訊 loopback 與麥克風擷取（§5.2）。純 Rust 綁定，不需要 C++ 工具鏈，
# 因此交叉編譯到 Windows 不會像 whisper.cpp 那樣需要額外處理。
wasapi = "0.23"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "4", features = ["apple-native-keyring-store"] }
# macOS 走靜態連結。動態版連的是 `@rpath/libonnxruntime.dylib` 與
# `@rpath/libsherpa-onnx-c-api.dylib`，但 Tauri 產出的 .app 裡沒有這兩個檔案、
# 執行檔也沒有任何 LC_RPATH（解析 dry run 產物的 Mach-O 載入指令確認過），
# 於是 app 會在 dyld 階段就死掉，連 main 都進不去。把函式庫塞進
# Contents/Frameworks 再補 rpath 只是把問題搬到打包步驟，靜態連結是把這
# 一整類失敗消掉。
#
# 不含 tts：預編的 static 包沒有那些符號，而這個產品也不做語音合成。
sherpa-rs = { version = "0.6.8", default-features = false, features = [
    "static",
    "download-binaries",
] }
# 系統音訊走 ScreenCaptureKit（macOS 13+），它可以直接指定 16 kHz 單聲道，
# 錄下來就是轉錄要的格式。
screencapturekit = "8"
# 麥克風走 CoreAudio。不跟系統音訊共用 ScreenCaptureKit 是因為它的麥克風
# 擷取要 macOS 15，綁在那上面等於讓 13 與 14 的使用者錄不到自己的聲音。
cpal = "0.18"
# CoreAudio 給的是裝置原生取樣率（內建麥克風多半 48 kHz）。直接每三個取一個
# 會把 8 kHz 以上摺回可聽範圍，齒音與子音正好在那裡。
rubato = "4"


# whisper-rs-sys 在交叉編譯時不會開啟 x86 SIMD：GGML_NATIVE 偵測的是編譯主機
# 而不是目標，結果 Windows 版慢九倍（RTF 3.96 對原生的 0.45）。這份 patch 只
# 多加四個 cmake define，其餘與上游相同。
[patch.crates-io]
whisper-rs-sys = { path = "vendor/whisper-rs-sys" }

# sherpa-rs 的 Diarize::compute 有兩個會讓行程崩潰的問題：C 端回傳 null 時
# 直接解參考，以及「分不出語者」那條路徑提早 bail 而跳過資源釋放，累積幾次
# 之後堆就壞了。這份 patch 只補這兩處，其餘與上游相同。
sherpa-rs = { path = "vendor/sherpa-rs" }
