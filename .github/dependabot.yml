version: 2
updates:
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # vendored patch 是刻意釘住的：升上游會把 build.rs 與崩潰修正洗掉，
    # 兩者的理由記在 src-tauri/vendor/README.md
    ignore:
      - dependency-name: whisper-rs-sys
      - dependency-name: sherpa-rs
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
