name: Audit

on:
  schedule:
    - cron: '0 3 * * 1'
  push:
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '.github/workflows/audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # 排程跑的時候開 issue，push / PR 上跑的時候寫 check run。少了 checks
      # 這一項，掃描本身乾淨也照樣紅：action 會在最後一步倒在
      # "Resource not accessible by integration"。
      issues: write
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Cargo.lock 在 src-tauri/ 底下，不在 repo 根目錄
          working-directory: src-tauri
